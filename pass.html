<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Your LobsterClass Pass</title>
<style>
  :root {
    --bg:#f6f5fb; --surface:#fff; --text:#191531; --muted:#6d6790; --border:#e2def0;
    --grad:linear-gradient(115deg,#ff3d8f,#8b5cf6 52%,#22d3ee);
    --grad-text:linear-gradient(115deg,#d6217f,#6d28d9 52%,#0e7490);
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#12101d; --surface:#1b1830; --text:#f0eefb; --muted:#a09ac2; --border:#322c52;
    --grad-text:linear-gradient(115deg,#ff3d8f,#8b5cf6 52%,#22d3ee);
  } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Avenir Next","Avenir","Segoe UI",system-ui,sans-serif; font-size:16.5px; line-height:1.6; }
  header { padding:16px 22px; }
  header a { text-decoration:none; color:var(--text); font-weight:800; font-size:20px; }
  header em { font-style:normal; background:var(--grad-text); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .rule { height:2px; background:var(--grad); }
  main { max-width:560px; margin:0 auto; padding:40px 20px 80px; text-align:center; }
  h1 { font-size:clamp(26px,6vw,34px); font-weight:800; letter-spacing:-.02em; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:26px 22px; margin:22px 0;
    box-shadow:0 2px 6px rgba(38,22,68,.06), 0 10px 30px rgba(38,22,68,.07); }
  #code { font-size:clamp(17px,4.6vw,24px); font-weight:800; letter-spacing:.04em;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    background:var(--grad-text); -webkit-background-clip:text; background-clip:text; color:transparent;
    word-break:break-all; margin:10px 0 16px; }
  .btn { display:inline-block; border:none; background:var(--grad); color:#fff; padding:11px 24px;
    border-radius:999px; cursor:pointer; font-size:15.5px; font-weight:700; font-family:inherit; }
  .muted { color:var(--muted); font-size:14.5px; }
  ol { text-align:left; max-width:400px; margin:18px auto; padding-left:24px; }
  ol li { margin:8px 0; }
  #status { min-height:24px; }
</style>
</head>
<body>
<header><a href="/"><img src="icon.svg" alt="" style="width:1.4em;height:1.4em;border-radius:22%;vertical-align:-0.34em"> Lobster<em>Class</em></a></header>
<div class="rule"></div>
<main>
  <h1 id="title">Getting your pass…</h1>
  <div class="card" id="passCard" style="display:none">
    <div class="muted" id="planLine"></div>
    <div id="code"></div>
    <button class="btn" id="copyBtn">Copy pass code</button>
    <p class="muted" id="status"></p>
  </div>
  <div id="err" class="muted" style="display:none"></div>
  <ol id="steps" style="display:none">
    <li>Copy the pass code above (also keep your Stripe receipt — the code can be recovered from it).</li>
    <li>Open <a href="/app.html">the app</a> → ⚙ Settings.</li>
    <li>Paste it into the <b>LobsterClass Pass</b> field and hit Save.</li>
    <li>Roleplay is live — go get grilled. 🦞</li>
  </ol>
</main>
<script>
"use strict";
// Set after deploying the Worker (README step 5), e.g. "https://lobsterclass-proxy.<you>.workers.dev"
const PROXY_URL = "";
(async function () {
  const qs = new URLSearchParams(location.search);
  const sid = qs.get("session_id") || "";
  // don't leave the Stripe session id in history / shareable URLs
  history.replaceState(null, "", location.pathname);
  const fail = (msg) => {
    document.getElementById("title").textContent = "Hmm — that didn't work";
    const e = document.getElementById("err");
    e.style.display = "block";
    e.textContent = msg;
  };
  if (!PROXY_URL) return fail("The pass service isn't configured yet. If you just paid, contact support with your receipt.");
  if (!sid) return fail("Missing checkout reference. Open this page from the link Stripe sent you after payment, or contact support with your receipt.");
  try {
    const r = await fetch(PROXY_URL + "/api/claim?session_id=" + encodeURIComponent(sid));
    const out = await r.json();
    if (!r.ok || !out.pass) return fail(out.error || "Couldn't verify the payment. Contact support with your receipt.");
    document.getElementById("title").textContent = "You're in 🦞";
    const days = Math.max(1, Math.round((out.expires - Date.now()) / 86400000));
    document.getElementById("planLine").textContent = out.plan + " · " + days + " days";
    document.getElementById("code").textContent = out.pass;
    document.getElementById("passCard").style.display = "block";
    document.getElementById("steps").style.display = "block";
    document.getElementById("copyBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(out.pass);
        document.getElementById("status").textContent = "Copied — paste it in the app's Settings.";
      } catch {
        document.getElementById("status").textContent = "Copy blocked — select the code and copy it manually.";
      }
    });
  } catch {
    fail("Couldn't reach the pass service — refresh this page to try again. Your payment is safe; this page can be reopened any time.");
  }
})();
</script>
</body>
</html>
